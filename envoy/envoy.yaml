
static_resources:

  # ==================================================
  # 1. LISTENERS
  # ==================================================
  listeners:
    - name: public_http_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080

      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager

                stat_prefix: ingress_http

                # Client IP handling
                use_remote_address: true
                xff_num_trusted_hops: 0

                # ==================================================
                # 2. ROUTE CONFIGURATION
                # ==================================================
                route_config:
                  name: local_route

                  virtual_hosts:
                    - name: backend_service
                      domains:
                        - "*"

                      routes:
                        - match:
                            prefix: "/"

                          route:
                            cluster: nodejs_backend

                            # Rate-limit configuration belongs
                            # inside RouteAction.
                            rate_limits:
                              - actions:
                                  - remote_address: {}

                # ==================================================
                # 3. HTTP FILTERS
                # ==================================================
                http_filters:

                  # Global rate-limit filter
                  - name: envoy.filters.http.ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ratelimit.v3.RateLimit

                      domain: backend-api

                      # Fail closed if Go RLS is unavailable
                      failure_mode_deny: true

                      timeout: 0.25s

                      enable_retry_after_header: true

                      rate_limit_service:
                        grpc_service:
                          envoy_grpc:
                            cluster_name: rate_limit_service

                        transport_api_version: V3

                  # Router filter must be last
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  # ==================================================
  # 4. UPSTREAM CLUSTERS
  # ==================================================
  clusters:

    # Node.js Express backend
    - name: nodejs_backend
      type: STRICT_DNS
      connect_timeout: 5s
      lb_policy: ROUND_ROBIN

      load_assignment:
        cluster_name: nodejs_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 3000

    # Go Rate Limit Service
    - name: rate_limit_service
      type: STRICT_DNS
      connect_timeout: 1s
      http2_protocol_options: {}

      load_assignment:
        cluster_name: rate_limit_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 8081

# ==================================================
# 5. ENVOY ADMIN
# ==================================================
admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901
